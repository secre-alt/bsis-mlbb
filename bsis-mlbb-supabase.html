<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSIS MLBB Intramurals 2026 — Standings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',sans-serif;background:#0e0e0e;color:#fff;min-height:100vh}
:root{--orange:#FF6A00;--red:#E53935}
.app{min-height:100vh}
.nav{background:#111;border-bottom:1px solid #1f1f1f;position:sticky;top:0;z-index:100}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:52px;gap:24px}
.nav-brand{font-size:13px;font-weight:800;letter-spacing:2px;color:#fff;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-brand span{color:var(--orange)}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav-link{background:none;border:none;color:#888;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;cursor:pointer;border-radius:3px;transition:color 0.15s}
.nav-link:hover{color:#fff}
.nav-link.active{color:#fff;background:#1e1e1e}
.nav-link.admin-link{color:#555}
.nav-link.admin-link.active{color:var(--orange);background:#1e0d00}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.admin-badge{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:#1e0d00;color:var(--orange);border:1px solid #3a1a00;padding:3px 8px;border-radius:2px}
.lock-btn{background:none;border:1px solid #2a2a2a;color:#555;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:3px;cursor:pointer;transition:all 0.15s}
.lock-btn:hover{border-color:#444;color:#aaa}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#333;display:inline-block;margin-left:4px;vertical-align:middle;transition:background 0.3s}
.sync-dot.syncing{background:var(--orange)}
.sync-dot.ok{background:#4ade80}
.sync-dot.err{background:var(--red)}
/* PASSWORD MODAL */
.pw-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.pw-card{background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:32px;width:100%;max-width:360px}
.pw-title{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.pw-heading{font-size:20px;font-weight:800;margin-bottom:6px}
.pw-sub{font-size:12px;color:#555;margin-bottom:24px}
.pw-input{background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;font-size:15px;font-family:'Inter',sans-serif;padding:11px 14px;border-radius:3px;outline:none;width:100%;margin-bottom:10px;transition:border 0.15s;letter-spacing:2px}
.pw-input:focus{border-color:var(--orange)}
.pw-error{font-size:11px;color:var(--red);margin-bottom:10px;min-height:16px}
.pw-btn{background:var(--orange);color:#fff;border:none;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:11px 20px;border-radius:3px;cursor:pointer;width:100%;transition:opacity 0.15s}
.pw-btn:hover{opacity:0.85}
.pw-cancel{background:none;border:none;color:#555;font-size:11px;font-weight:600;cursor:pointer;margin-top:12px;display:block;text-align:center;width:100%}
.pw-cancel:hover{color:#aaa}
/* SETUP */
.setup-screen{max-width:520px;margin:80px auto;padding:0 20px}
.setup-card{background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:32px}
.setup-title{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.setup-heading{font-size:22px;font-weight:800;margin-bottom:6px}
.setup-sub{font-size:12px;color:#555;margin-bottom:24px;line-height:1.7}
.setup-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.step-num{width:22px;height:22px;border-radius:50%;background:#1e1e1e;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#888;flex-shrink:0;margin-top:1px}
.step-text{font-size:12px;color:#aaa;line-height:1.7}
.step-text code{background:#1a1a1a;border:1px solid #2a2a2a;padding:1px 6px;border-radius:3px;font-size:11px;color:#ccc;font-family:monospace}
.step-text a{color:var(--orange);text-decoration:none}
/* HERO */
.hero{background:#111;border-bottom:1px solid #1f1f1f;padding:28px 20px 24px}
.hero-inner{max-width:1200px;margin:0 auto}
.hero-label{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.hero-title{font-size:28px;font-weight:900;letter-spacing:-0.5px;text-transform:uppercase;line-height:1.1}
.hero-sub{font-size:12px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:4px;display:flex;align-items:center;gap:6px}
.hero-meta{display:flex;gap:24px;margin-top:20px;padding-top:20px;border-top:1px solid #1f1f1f;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column}
.stat-val{font-size:20px;font-weight:800;color:#fff;line-height:1}
.stat-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1.5px;margin-top:3px}
.stat-divider{width:1px;background:#1f1f1f}
/* LAYOUT */
.main{max-width:1200px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:1fr 320px;gap:24px}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.section-label{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#555;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:#1f1f1f}
/* TABLE */
.table-wrap{background:#141414;border:1px solid #1f1f1f;border-radius:4px;overflow:hidden}
.table-header{display:grid;grid-template-columns:36px 1fr 36px 36px 36px 40px 40px 44px 48px 40px;padding:8px 16px;background:#0e0e0e;border-bottom:1px solid #1f1f1f}
.th{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#444;text-align:center}
.th:nth-child(2){text-align:left}
.team-row{display:grid;grid-template-columns:36px 1fr 36px 36px 36px 40px 40px 44px 48px 40px;padding:0 16px;align-items:center;min-height:52px;border-bottom:1px solid #191919;transition:background 0.1s;position:relative}
.team-row:last-child{border-bottom:none}
.team-row:hover{background:#181818}
.team-row.rank-1{background:#1a1200}
.team-row.rank-1:hover{background:#1e1500}
.rank-indicator{position:absolute;left:0;top:0;bottom:0;width:3px}
.rank-1 .rank-indicator{background:var(--orange)}
.rank-2 .rank-indicator{background:#888}
.rank-3 .rank-indicator{background:#6b4c1a}
.rank-num{font-size:13px;font-weight:800;text-align:center;color:#555}
.rank-1 .rank-num{color:var(--orange);font-size:15px}
.rank-2 .rank-num{color:#aaa}
.team-info{display:flex;align-items:center;gap:10px;min-width:0}
.team-logo{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0}
.team-names{min-width:0}
.team-abbr{font-size:12px;font-weight:700;white-space:nowrap}
.team-full{font-size:10px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.td{font-size:12px;font-weight:600;text-align:center;color:#ccc}
.td.wins{color:#4ade80}
.td.losses{color:#f87171}
.td.diff-pos{color:#4ade80}
.td.diff-neg{color:#f87171}
.td.diff-zero{color:#555}
.pts-cell{font-size:14px;font-weight:800;text-align:center;color:var(--orange)}
/* MATCH CARDS */
.match-card{background:#141414;border:1px solid #1f1f1f;border-radius:4px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.match-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.match-card.completed::before{background:#333}
.match-card.winner::before{background:var(--orange)}
.match-meta{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#444;margin-bottom:8px;display:flex;justify-content:space-between}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.match-team{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.match-team-logo{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.match-team-abbr{font-size:11px;font-weight:700;text-transform:uppercase}
.match-team.winner .match-team-abbr{color:#fff}
.match-team.loser .match-team-abbr{color:#444}
.match-score{display:flex;align-items:center;gap:6px}
.score-num{font-size:22px;font-weight:900}
.score-num.win{color:var(--orange)}
.score-num.lose{color:#333}
.score-sep{font-size:12px;color:#333;font-weight:700}
.match-status{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:8px;text-align:center}
.status-final{color:#555}
.status-upcoming{color:var(--orange)}
.upcoming-card{background:#141414;border:1px solid #1f1f1f;border-radius:4px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.upcoming-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
.upcoming-meta{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#444;margin-bottom:8px;display:flex;justify-content:space-between}
.upcoming-vs{display:flex;align-items:center;justify-content:space-between}
.upcoming-team{display:flex;align-items:center;gap:8px;flex:1}
.upcoming-abbr{font-size:12px;font-weight:700}
.vs-badge{font-size:9px;font-weight:800;letter-spacing:2px;background:#1e1e1e;color:#555;padding:4px 8px;border-radius:2px}
/* SCHEDULE */
.schedule-filter{display:flex;gap:6px;margin-bottom:16px}
.filter-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#666;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;border-radius:3px;cursor:pointer;transition:all 0.15s}
.filter-btn.active{background:#1e0d00;border-color:var(--orange);color:var(--orange)}
.round-group{margin-bottom:24px}
.round-label{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--orange);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #1f1f1f}
.schedule-row{display:grid;grid-template-columns:24px 1fr 80px 80px 70px;gap:12px;padding:12px 14px;background:#141414;border:1px solid #1f1f1f;border-radius:3px;margin-bottom:6px;align-items:center}
.schedule-match-num{font-size:10px;font-weight:700;color:#444}
.schedule-teams{font-size:12px;font-weight:600}
.schedule-teams span{color:#555}
.schedule-time{font-size:11px;color:#666;text-align:center}
.schedule-score{font-size:12px;font-weight:700;text-align:center}
.schedule-status{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;text-align:right}
/* TEAMS */
.teams-list{display:flex;flex-direction:column;gap:6px}
.team-item{background:#141414;border:1px solid #1f1f1f;border-radius:3px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.team-item-logo{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.team-item-info{flex:1;min-width:0}
.team-item-abbr{font-size:13px;font-weight:700}
.team-item-name{font-size:11px;color:#555;margin-top:1px}
/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#555}
.form-input,.form-select{background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;font-size:13px;font-family:'Inter',sans-serif;padding:9px 12px;border-radius:3px;outline:none;transition:border 0.15s;width:100%}
.form-input:focus,.form-select:focus{border-color:var(--orange)}
.form-select option{background:#1a1a1a}
.btn-primary{background:var(--orange);color:#fff;border:none;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 20px;border-radius:3px;cursor:pointer;transition:opacity 0.15s}
.btn-primary:hover{opacity:0.85}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed}
.btn-secondary{background:#1e1e1e;color:#aaa;border:1px solid #2a2a2a;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 20px;border-radius:3px;cursor:pointer}
.btn-danger{background:transparent;color:var(--red);border:1px solid #2a1010;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:3px;cursor:pointer}
.btn-danger:hover{background:#1a0808}
.btn-small{padding:5px 10px;font-size:9px}
/* LOCKED STATE */
.locked-banner{background:#0e0e0e;border:1px solid #1f1f1f;border-radius:4px;padding:40px 20px;text-align:center}
.locked-icon{font-size:28px;margin-bottom:12px}
.locked-title{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:6px}
.locked-sub{font-size:12px;color:#333;margin-bottom:20px}
/* SKELETON */
.skeleton{background:linear-gradient(90deg,#1a1a1a 25%,#222 50%,#1a1a1a 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:3px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-row{height:52px;margin-bottom:1px}
.empty-state{text-align:center;padding:40px 20px;color:#444}
.empty-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.empty-sub{font-size:11px;color:#333}
.win-streak{display:flex;gap:2px;align-items:center;justify-content:center}
.streak-dot{width:5px;height:5px;border-radius:50%}
.streak-w{background:#4ade80}
.streak-l{background:#f87171}
.toast{position:fixed;bottom:24px;right:24px;background:#1e1e1e;border:1px solid #333;border-left:3px solid var(--orange);color:#fff;font-size:12px;font-weight:600;padding:12px 18px;border-radius:3px;z-index:400;opacity:0;transform:translateY(8px);transition:all 0.2s;pointer-events:none;max-width:300px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{border-left-color:var(--red)}
@media(max-width:700px){
  .table-header{display:none}
  .team-row{grid-template-columns:40px 1fr auto;min-height:auto;padding:12px 16px}
  .team-row .td:not(.pts-cell){display:none}
  .schedule-row{grid-template-columns:20px 1fr 50px 60px}
  .schedule-time{display:none}
  .main{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .nav-inner{gap:12px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SUPABASE_URL     = 'https://fplgjckwzumlvlusoqfg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DmhRkcYVthqaldvtPO1AUQ_AoqCK4nl';

// Change this to your organizer password
const ADMIN_PASSWORD = 'bsis2026';
// ─────────────────────────────────────────────────────────────────────────────

const TEAM_COLORS = [
  {bg:'#FF6A00',text:'#fff'},{bg:'#E53935',text:'#fff'},{bg:'#1565C0',text:'#fff'},
  {bg:'#2E7D32',text:'#fff'},{bg:'#6A1B9A',text:'#fff'},{bg:'#00838F',text:'#fff'}
];
const COLOR_NAMES = ['Orange','Red','Blue','Green','Purple','Teal'];

let db = null;
let channel = null;

// Persist admin session in sessionStorage (clears when tab closes)
let isAdmin = sessionStorage.getItem('bsis-admin') === '1';

let state = {
  teams: [], matches: [],
  page: 'standings',
  scheduleFilter: 'all',
  loading: true,
  syncStatus: 'idle',
  configured: false,
  showPwModal: false,
  pwError: '',
};

// ─── SUPABASE ────────────────────────────────────────────────────────────────
function initSupabase() {
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') { state.configured = false; state.loading = false; render(); return; }
  state.configured = true;
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadAll();
  subscribeRealtime();
}

async function loadAll() {
  state.loading = true; setSyncStatus('syncing'); render();
  try {
    const [{ data: teams, error: te }, { data: matches, error: me }] = await Promise.all([
      db.from('teams').select('*').order('id'),
      db.from('matches').select('*').order('num')
    ]);
    if (te || me) throw te || me;
    state.teams = teams.map(normalizeTeam);
    state.matches = matches.map(normalizeMatch);
    setSyncStatus('ok');
  } catch (e) {
    console.error(e); setSyncStatus('err');
    showToast('Could not load data. Check your Supabase config.', true);
  }
  state.loading = false; render();
}

function normalizeTeam(t) { return { id: t.id, abbr: t.abbr, name: t.name, colorIdx: t.color_idx ?? 0 }; }
function normalizeMatch(m) { return { id: m.id, num: m.num, round: m.round, teamA: m.team_a, teamB: m.team_b, scoreA: m.score_a, scoreB: m.score_b, date: m.match_date, time: m.match_time, status: m.status }; }

function subscribeRealtime() {
  if (channel) db.removeChannel(channel);
  channel = db.channel('bsis-mlbb')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, () => loadAll())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, () => loadAll())
    .subscribe();
}

// ─── AUTH ────────────────────────────────────────────────────────────────────
function openAdminLogin() { state.showPwModal = true; state.pwError = ''; render(); setTimeout(() => { const el = document.getElementById('pw-input'); if (el) el.focus(); }, 50); }
function closeAdminLogin() { state.showPwModal = false; state.pwError = ''; render(); }

function submitPassword() {
  const val = document.getElementById('pw-input')?.value || '';
  if (val === ADMIN_PASSWORD) {
    isAdmin = true;
    sessionStorage.setItem('bsis-admin', '1');
    state.showPwModal = false; state.pwError = '';
    state.page = 'admin';
    showToast('Admin access granted');
    render();
  } else {
    state.pwError = 'Incorrect password.';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-error').textContent = state.pwError;
    document.getElementById('pw-input').focus();
  }
}

function lockAdmin() {
  isAdmin = false;
  sessionStorage.removeItem('bsis-admin');
  state.page = 'standings';
  showToast('Logged out of admin');
  render();
}

function handlePwKey(e) { if (e.key === 'Enter') submitPassword(); }

// ─── SYNC ────────────────────────────────────────────────────────────────────
function setSyncStatus(s) {
  state.syncStatus = s;
  const dot = document.getElementById('sync-dot');
  if (dot) dot.className = 'sync-dot ' + (s==='syncing'?'syncing':s==='ok'?'ok':s==='err'?'err':'');
}

// ─── DATA ────────────────────────────────────────────────────────────────────
function getTeam(id) { return state.teams.find(t => t.id === id); }
function getColor(t) { return TEAM_COLORS[t.colorIdx] || TEAM_COLORS[0]; }

function calcStandings() {
  const s = {};
  state.teams.forEach(t => { s[t.id] = { id: t.id, mp:0, w:0, l:0, gw:0, gl:0, pts:0, form:[] }; });
  state.matches.filter(m => m.status === 'completed').forEach(m => {
    const a = s[m.teamA], b = s[m.teamB]; if (!a || !b) return;
    a.mp++; b.mp++; a.gw += m.scoreA; a.gl += m.scoreB; b.gw += m.scoreB; b.gl += m.scoreA;
    if (m.scoreA > m.scoreB) { a.w++; a.pts++; b.l++; a.form.push('W'); b.form.push('L'); }
    else { b.w++; b.pts++; a.l++; b.form.push('W'); a.form.push('L'); }
  });
  return Object.values(s).map(t => ({ ...t, diff: t.gw-t.gl, wr: t.mp>0?Math.round((t.w/t.mp)*100):0 }))
    .sort((a,b) => b.pts-a.pts || b.w-a.w || b.diff-a.diff || b.gw-a.gw);
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (isErr?' err':'');
  setTimeout(() => el.className = 'toast', 2800);
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function navigate(page) {
  if ((page === 'admin' || page === 'teams') && !isAdmin) { openAdminLogin(); return; }
  state.page = page; render();
}
function setFilter(f) { state.scheduleFilter = f; render(); }

// ─── DB WRITES (admin only) ──────────────────────────────────────────────────
function requireAdmin() { if (!isAdmin) { showToast('Admin access required', true); return false; } return true; }

async function addTeam() {
  if (!requireAdmin()) return;
  const abbr = document.getElementById('new-abbr').value.trim().toUpperCase();
  const name = document.getElementById('new-name').value.trim();
  const colorIdx = parseInt(document.getElementById('new-color').value);
  if (!abbr || !name) { showToast('Fill in all fields', true); return; }
  setSyncStatus('syncing');
  const { error } = await db.from('teams').insert({ abbr, name, color_idx: colorIdx });
  if (error) { showToast('Failed to add team', true); setSyncStatus('err'); return; }
  showToast(`${abbr} added`);
}

async function deleteTeam(id) {
  if (!requireAdmin()) return;
  const team = getTeam(id); if (!team) return;
  if (!confirm(`Delete ${team.abbr}? This also removes all their matches.`)) return;
  setSyncStatus('syncing');
  const { error } = await db.from('teams').delete().eq('id', id);
  if (error) { showToast('Failed to delete', true); setSyncStatus('err'); return; }
  showToast(`${team.abbr} deleted`);
}

async function submitMatch() {
  if (!requireAdmin()) return;
  const num=parseInt(document.getElementById('a-num').value);
  const round=parseInt(document.getElementById('a-round').value);
  const date=document.getElementById('a-date').value;
  const time=document.getElementById('a-time').value;
  const taId=parseInt(document.getElementById('a-ta').value);
  const tbId=parseInt(document.getElementById('a-tb').value);
  const sA=parseInt(document.getElementById('a-score').value);
  const sB=parseInt(document.getElementById('b-score').value);
  const errEl=document.getElementById('admin-error');
  if (taId===tbId){errEl.textContent='Teams cannot be the same.';errEl.style.display='block';return;}
  if (sA===sB){errEl.textContent='Score cannot be tied.';errEl.style.display='block';return;}
  if (sA!==2&&sB!==2){errEl.textContent='Winner must have exactly 2 wins (best of 3).';errEl.style.display='block';return;}
  errEl.style.display='none';
  const btn=document.getElementById('submit-btn');
  if (btn){btn.disabled=true;btn.textContent='Saving...';}
  setSyncStatus('syncing');
  const existing=state.matches.find(m=>m.num===num);
  const payload={num,round,team_a:taId,team_b:tbId,score_a:sA,score_b:sB,match_date:date,match_time:time,status:'completed'};
  let error;
  if (existing){({error}=await db.from('matches').update(payload).eq('id',existing.id));}
  else{({error}=await db.from('matches').insert(payload));}
  if (error){showToast('Failed to save match',true);setSyncStatus('err');if(btn){btn.disabled=false;btn.textContent='Submit result';}return;}
  const winner=sA>sB?getTeam(taId):getTeam(tbId);
  showToast(`Match ${num} recorded · ${winner.abbr} wins ${sA}–${sB}`);
  navigate('standings');
}

async function scheduleMatch() {
  if (!requireAdmin()) return;
  const taId=parseInt(document.getElementById('s-ta').value);
  const tbId=parseInt(document.getElementById('s-tb').value);
  if (taId===tbId){showToast('Teams must be different',true);return;}
  const payload={num:parseInt(document.getElementById('s-num').value),round:parseInt(document.getElementById('s-round').value),team_a:taId,team_b:tbId,score_a:null,score_b:null,match_date:document.getElementById('s-date').value,match_time:document.getElementById('s-time').value,status:'upcoming'};
  setSyncStatus('syncing');
  const {error}=await db.from('matches').insert(payload);
  if (error){showToast('Failed to schedule match',true);setSyncStatus('err');return;}
  showToast('Match scheduled');
}

function adjScore(id,delta){const el=document.getElementById(id);if(!el)return;el.value=Math.max(0,Math.min(3,(parseInt(el.value)||0)+delta));}

function renderStandings(){
  if(state.loading)return renderHero()+`<div class="main"><div>${skeletonTable()}</div><div></div></div>`;

  const completed=state.matches.filter(m=>m.status==='completed').slice(-3).reverse();
  const upcoming=state.matches.filter(m=>m.status==='upcoming').slice(0,3);
  let rows='';
  st.forEach((s,i)=>{
    const rank=i+1;const team=getTeam(s.id);if(!team)return;
    const rc=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';
    const dc=s.diff>0?'diff-pos':s.diff<0?'diff-neg':'diff-zero';
    const form=s.form.slice(-5).map(f=>`<div class="streak-dot ${f==='W'?'streak-w':'streak-l'}"></div>`).join('');
    rows+=`<div class="team-row ${rc}">

      <div class="td">${s.mp}</div><div class="td wins">${s.w}</div><div class="td losses">${s.l}</div>
      <div class="td">${s.gw}</div><div class="td">${s.gl}</div>
      <div class="td ${dc}">${s.diff>0?'+'+s.diff:s.diff}</div>
      <div class="td"><div class="win-streak">${form}</div></div>
      <div class="td pts-cell">${s.pts}</div>
    </div>`;
  });
  const resultCard=m=>{
    const ta=getTeam(m.teamA),tb=getTeam(m.teamB);if(!ta||!tb)return'';
    const aWin=m.scoreA>m.scoreB;
    return`<div class="match-card ${aWin?'winner':'completed'}">
      <div class="match-meta"><span>Match ${m.num} · R${m.round}</span><span style="color:#555">${m.date||''}</span></div>

        <div class="match-score"><div class="score-num ${aWin?'win':'lose'}">${m.scoreA}</div><div class="score-sep">:</div><div class="score-num ${!aWin?'win':'lose'}">${m.scoreB}</div></div>
        <div class="match-team ${!aWin?'winner':'loser'}">${logoDiv(tb,32,10)}<div class="match-team-abbr">${tb.abbr}</div></div>
      </div>
      <div class="match-status status-final">FINAL · ${aWin?ta.abbr:tb.abbr} wins</div>
    </div>`;
  };
  const upcomingCard=m=>{
    const ta=getTeam(m.teamA),tb=getTeam(m.teamB);if(!ta||!tb)return'';
    return`<div class="upcoming-card">
      <div class="upcoming-meta"><span>Match ${m.num} · R${m.round}</span><span style="color:var(--orange)">${m.time||''}</span></div>
      <div class="upcoming-vs">
        <div class="upcoming-team">${logoDiv(ta,28,8)}<div class="upcoming-abbr">${ta.abbr}</div></div>
        <div class="vs-badge">VS</div>
        <div class="upcoming-team" style="justify-content:flex-end;flex-direction:row-reverse">${logoDiv(tb,28,8)}<div class="upcoming-abbr">${tb.abbr}</div></div>
      </div>
      <div class="match-status status-upcoming">UPCOMING · ${m.date||''}</div>
    </div>`;
  };
  return`${renderHero()}<div class="main">
    <div>
      <div class="section-label">Standings</div>
      <div class="table-wrap">
        <div class="table-header"><div class="th">#</div><div class="th" style="text-align:left">Team</div><div class="th">MP</div><div class="th">W</div><div class="th">L</div><div class="th">GW</div><div class="th">GL</div><div class="th">+/-</div><div class="th">Form</div><div class="th">PTS</div></div>
        ${rows||'<div class="empty-state"><div class="empty-title">No teams yet</div></div>'}
      </div>

    </div>

      ${completed.length?completed.map(resultCard).join(''):'<div class="empty-state"><div class="empty-title">No results yet</div></div>'}

      ${upcoming.length?upcoming.map(upcomingCard).join(''):'<div class="empty-state"><div class="empty-title">No upcoming matches</div></div>'}

        <div class="form-group" style="margin-bottom:12px"><label class="form-label">Team A</label><select class="form-select" id="s-ta">${teamOpts}</select></div>
        <div class="form-group" style="margin-bottom:14px"><label class="form-label">Team B</label><select class="form-select" id="s-tb">${t2opts}</select></div>
        <button class="btn-secondary" onclick="scheduleMatch()" style="width:100%">Schedule match</button>
      </div>
    </div>
  </div>`;
}

function renderSetup(){
  return`<div class="setup-screen"><div class="setup-card">
    <div class="setup-title">Setup required</div>
    <div class="setup-heading">Connect Supabase</div>
    <div class="setup-sub">Open this file in a text editor and fill in your <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code>, and change <code>ADMIN_PASSWORD</code> at the top of the script.</div>
    <div class="setup-step"><div class="step-num">1</div><div class="step-text">Create a free project at <a href="https://supabase.com" target="_blank">supabase.com</a></div></div>
    <div class="setup-step"><div class="step-num">2</div><div class="step-text">Run <code>supabase-schema.sql</code> in the Supabase SQL Editor</div></div>
    <div class="setup-step"><div class="step-num">3</div><div class="step-text">Copy your Project URL and anon key from <b>Project Settings → API</b></div></div>
    <div class="setup-step"><div class="step-num">4</div><div class="step-text">Paste them into this file and set your <code>ADMIN_PASSWORD</code>, then reload</div></div>
  </div></div>`;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
  const adminControls = isAdmin
    ? `<div class="nav-right"><span class="admin-badge">Admin</span><button class="lock-btn" onclick="lockAdmin()">Lock</button></div>`
    : `<div class="nav-right"><button class="lock-btn" onclick="openAdminLogin()">Organizer login</button></div>`;

  const nav=`<nav class="nav"><div class="nav-inner">
    <div class="nav-brand"><span>BSIS</span> MLBB</div>
    <div class="nav-links">
      <button class="nav-link ${state.page==='standings'?'active':''}" onclick="navigate('standings')">Standings</button>
      <button class="nav-link ${state.page==='matches'?'active':''}" onclick="navigate('matches')">Matches</button>
      <button class="nav-link ${state.page==='schedule'?'active':''}" onclick="navigate('schedule')">Schedule</button>
      ${isAdmin?`<button class="nav-link admin-link ${state.page==='teams'?'active':''}" onclick="navigate('teams')">Teams</button>
      <button class="nav-link admin-link ${state.page==='admin'?'active':''}" onclick="navigate('admin')">Enter Result</button>`:''}
    </div>
    ${adminControls}
  </div></nav>`;

  let content='';
  if(!state.configured) content=renderSetup();
  else if(state.page==='standings') content=renderStandings();
  else if(state.page==='matches')   content=renderMatches();
  else if(state.page==='schedule')  content=renderSchedule();
  else if(state.page==='teams')     content=renderTeams();
  else if(state.page==='admin')     content=renderAdmin();

  const modal = state.showPwModal ? renderPwModal() : '';

  document.getElementById('root').innerHTML=`<div class="app">${nav}<div id="page-content">${content}</div></div>${modal}`;

  if(state.showPwModal){setTimeout(()=>{const el=document.getElementById('pw-input');if(el)el.focus();},50);}
}

render();
initSupabase();
</script>
</body>
</html>
