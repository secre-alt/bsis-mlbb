  <path d="M164 128h104c60 0 96 38 96 90 0 32-18 60-46 75 37 12 64 45 64 88 0 67-53 99-122 99H164V128zm56 48v76h44c34 0 54-19 54-39s-20-37-54-37h-44zm0 124v88h54c37 0 61-19 61-44 0-29-25-44-61-44h-54z" fill="url(#accent)" filter="url(#innerGlow)"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="256" r="6" fill="#ff8c5a" opacity="0.8"/>
</svg>
